global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    service: video-conference

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
    metrics_path: /metrics

  # Video Conference Backend
  - job_name: "video-conference-backend"
    static_configs:
      - targets: ["video-conference-backend-dev:9090"]
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Node.js application metrics (if using prom-client)
  - job_name: "nodejs-app"
    static_configs:
      - targets: ["video-conference-backend-dev:8081"]
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # PostgreSQL Exporter (if added)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Redis Exporter (if added)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Nginx metrics (if nginx-prometheus-exporter is used)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Node Exporter for system metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Development-specific settings
storage:
  tsdb:
    retention.time: 7d
    retention.size: 2GB
