global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: video-conference
    region: us-east-1

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 60s
    metrics_path: /metrics

  # Video Conference Backend with service discovery
  - job_name: 'video-conference-backend'
    static_configs:
      - targets: ['video-conference-backend-prod:9090']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 15s
    honor_labels: true
    params:
      collect[]:
        - cpu
        - memory
        - network
        - disk
        - process

  # Node.js application metrics
  - job_name: 'nodejs-app'
    static_configs:
      - targets: ['video-conference-backend-prod:8081']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 15s

  # Database metrics (External PostgreSQL)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 60s
    metrics_path: /metrics
    scrape_timeout: 15s

  # Redis metrics (External Redis)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 60s
    metrics_path: /metrics
    scrape_timeout: 15s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 15s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 60s
    metrics_path: /metrics
    scrape_timeout: 15s

  # Custom business metrics
  - job_name: 'business-metrics'
    static_configs:
      - targets: ['video-conference-backend-prod:8081']
    scrape_interval: 60s
    metrics_path: /api/metrics/business
    scrape_timeout: 15s

  # Health check monitoring
  - job_name: 'health-checks'
    static_configs:
      - targets: ['video-conference-backend-prod:8081']
    scrape_interval: 30s
    metrics_path: /health/prometheus
    scrape_timeout: 10s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

# Production storage settings
storage:
  tsdb:
    retention.time: 15d
    retention.size: 10GB
    wal_compression: true

# Remote write configuration (for long-term storage)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint.com/api/v1/write"
#     basic_auth:
#       username: "your-username"
#       password: "your-password"
#     queue_config:
#       max_samples_per_send: 1000
#       max_shards: 10
#       capacity: 10000

# Performance tuning for production
query:
  max_concurrency: 20
  timeout: 2m
  max_samples: 50000000