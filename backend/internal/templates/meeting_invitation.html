{{ define "body" }}
    <p>Hi,</p>
    <p>You've been invited to a meeting: <strong>{{ .MeetingTitle }}</strong></p>
    <p><strong>Description:</strong> {{ .MeetingDescription }}</p>
    <p><strong>When:</strong> {{ .ScheduledStart }} to {{ .ScheduledEnd }}</p>
    <p>Join the meeting by clicking the link below:</p>
    <a href="{{ .MeetingLink }}" class="meeting-button">Join Meeting</a>
    <p>We look forward to seeing you there!</p>
{{ end }}
